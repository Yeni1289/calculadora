<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Lenguaje - Operaciones básicas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 20px auto;
      background: linear-gradient(180deg,#f6fbff,#eef7ff);
      color: #222;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(17,24,39,0.08);
    }
    h1 { color: #0b63d6; margin-top: 0; }
    textarea {
      width: 100%;
      height: 150px;
      font-size: 1rem;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #cfd9ea;
      font-family: monospace;
      resize: vertical;
    }
    button {
      padding: 10px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: linear-gradient(90deg,#2fb66a,#1f9a52);
      color: #fff;
    }
    button:hover { transform: translateY(-1px); }
    .panel {
      margin-top: 18px;
      padding: 16px;
      border-radius: 8px;
      background: #f3f9ff;
      border: 1px solid #d9edff;
    }
    pre {
      background: #e8f7e4;
      border: 1px solid #b7e2b0;
      padding: 10px;
      border-radius: 6px;
      font-size: 1rem;
      overflow-x: auto;
    }
    .empty { color: #666; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Calculadora ANTLR</h1>

    <form method="POST">
      {% csrf_token %}
      <textarea name="codigo" placeholder="Escribe tu código aquí...">{{ codigo }}</textarea><br><br>
      <button type="submit">Ejecutar</button>
    </form>

    <div class="panel">
      <h2>Variables</h2>
      {% if resultado_final %}
        <pre>{{ resultado_final }}</pre>
      {% else %}
        <p class="empty">No hay resultados aún. Ejecuta tu código.</p>
      {% endif %}
    </div>

    <div class="panel">
      <h2>Paso a paso</h2>
      {% if arbol %}
        <pre>
{% for paso in arbol %}
{{ paso }}
{% endfor %}
        </pre>
      {% else %}
        <p class="empty">No hay pasos aún.</p>
      {% endif %}
    </div>
  </div>
</body>
</html>
